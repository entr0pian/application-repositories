name: external-dns-dev
values: |
  # Publishes dev's Ingress hosts (<component>.dev.gerodimos.dev) as Route53
  # aliases to dev's ALB. AWS permissions come from EKS Pod Identity -
  # bootstrap-cluster/terraform/modules/eks-cluster's external-dns.tf binds
  # its role (write access to the gerodimos.dev zone) to
  # external-dns/<serviceAccount.name>.
  provider:
    name: aws
  serviceAccount:
    name: external-dns
  sources:
    - ingress
  # sync: also deletes records whose Ingress is gone - but only records this
  # instance owns (TXT registry below).
  policy: sync
  # Stable across the daily cluster recreate, so a new dev cluster adopts
  # yesterday's records and repoints them at its own ALB.
  txtOwnerId: taskapp-dev
  # Fenced to dev's own subdomain; management's external-dns excludes it.
  domainFilters:
    - dev.gerodimos.dev
  extraArgs:
    - --aws-zone-type=public
