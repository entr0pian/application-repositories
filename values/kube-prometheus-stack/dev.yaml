name: kube-prometheus-stack-dev
values: |
  # Workload cluster: Prometheus + operator + exporters only. No Grafana -
  # dashboards live on management; dev's metrics will be remote-written to
  # Mimir on management later.
  crds:
    enabled: true

  grafana:
    enabled: false

  # EKS runs the control plane: its scheduler, controller-manager and etcd
  # can't be scraped, and kube-proxy binds its metrics to localhost.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  defaultRules:
    rules:
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      windows: false

  # No alert routing yet (later milestone).
  alertmanager:
    enabled: false

  nodeExporter:
    operatingSystems:
      aix:
        enabled: false
      darwin:
        enabled: false

  prometheus:
    prometheusSpec:
      # Select monitors/rules from every namespace regardless of labels
      # (golang-service ServiceMonitors carry no release label).
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorNamespaceSelector: {}
      ruleSelectorNilUsesHelmValues: false
      ruleNamespaceSelector: {}
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      # emptyDir TSDB, same reasoning as management: no EBS CSI driver,
      # cluster is ephemeral.
      retention: 2d
      retentionSize: 4GB
      # Ship platform metrics to Mimir on management, exactly like
      # management's Prometheus: only series with both component and
      # environment (platform components + platform:* rules); raw Kubernetes
      # metrics stay local. Credentials: mimir-remote-write (ExternalSecret
      # below), dev's own writer.
      remoteWrite:
        - name: mimir
          url: https://mimir.gerodimos.dev/api/v1/push
          basicAuth:
            username:
              name: mimir-remote-write
              key: username
            password:
              name: mimir-remote-write
              key: password
          writeRelabelConfigs:
            - sourceLabels: [component, environment]
              regex: ".+;.+"
              action: keep
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 2Gi

  prometheusOperator:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

  kube-state-metrics:
    # Same allowlist as management, so component/environment joins work the
    # same once these series reach Mimir.
    metricLabelsAllowlist:
      - pods=[platform.taskapp.io/component,platform.taskapp.io/environment]
      - deployments=[platform.taskapp.io/component,platform.taskapp.io/environment]
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi

  extraManifests:
    - |
      # Basic Auth for this Prometheus' future remoteWrite to Mimir
      # (username/password keys, as remoteWrite.basicAuth expects).
      # Generated by bootstrap-cluster/terraform/management-eks/mimir.tf.
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: mimir-remote-write
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: aws-secrets-manager
          kind: ClusterSecretStore
        target:
          name: mimir-remote-write
          creationPolicy: Owner
        data:
          - secretKey: username
            remoteRef:
              key: taskapp/dev/mimir-writer
              property: username
          - secretKey: password
            remoteRef:
              key: taskapp/dev/mimir-writer
              property: password
