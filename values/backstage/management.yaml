name: backstage-management
values: |
  image:
    repository: ghcr.io/entr0pian/backstage
    tag: "7d0155677b2ca3af170dfadb95dbbbbaf3bf0a10"
    pullPolicy: Always
  github:
    # Same AWS Secrets Manager path used by helm-charts/platform's
    # crossplane-github-credentials ExternalSecret and consumed by
    # component-operator/scaffold-operator — same PAT, synced into the
    # backstage namespace too since Secrets don't mount cross-namespace.
    secretPath: "taskapp/platform/crossplane-github-token"
    clusterSecretStoreName: aws-secrets-manager
  # This cluster has no real DNS hostname for backstage yet, so the only way
  # in is `kubectl port-forward svc/backstage 7007:7007` — set baseUrl to
  # match that exactly. Leaving it at the stock app-config.yaml default
  # (app.baseUrl=:3000, a separate dev-mode frontend port that doesn't exist
  # in this single-process packaged image, vs. backend.baseUrl=:7007) breaks
  # the guest-auth popup handshake ("Failed to sign in as a guest using the
  # auth backend"), since it validates against app.baseUrl. Once there's a
  # real ingress hostname, switch this (and ingress.enabled) to that instead.
  baseUrl: "http://localhost:7007"
  ingress:
    enabled: false
  # Discovers Database CRs from these namespaces and publishes them as
  # catalog Resource entities related to their owning Component (see
  # backstage/packages/backend/src/modules/platformEntityProvider/ and
  # BACKSTAGE_PART4.md). "management" included alongside dev/prod since this
  # cluster is currently standing in for all three environments.
  platformCatalog:
    enabled: true
    namespaces:
      - dev
      - prod
      - management
