name: backstage-management
values: |
  image:
    repository: ghcr.io/entr0pian/backstage
    tag: "7966ee46912c9175413421121067daec83d952b2"
    pullPolicy: Always
  github:
    # Same AWS Secrets Manager path used by helm-charts/platform's
    # crossplane-github-credentials ExternalSecret and consumed by
    # component-operator/scaffold-operator — same PAT, synced into the
    # backstage namespace too since Secrets don't mount cross-namespace.
    secretPath: "taskapp/platform/crossplane-github-token"
    clusterSecretStoreName: aws-secrets-manager
  argocd:
    # Read-only "backstage" ArgoCD API account (bootstrap-cluster/install-argocd
    # values.yaml's accounts.backstage/policy.csv) — see BACKSTAGE_PART5.md.
    secretPath: "taskapp/platform/argocd-backstage-token"
    clusterSecretStoreName: aws-secrets-manager
  githubAuth:
    # GitHub OAuth App credentials for the owner sign-in — only the GitHub
    # user with a matching User entity (backstage/org-data/users.yaml) can
    # sign in this way; everyone else browses read-only as guest.
    secretPath: "taskapp/platform/backstage-github-oauth"
    clusterSecretStoreName: aws-secrets-manager
  deployments:
    # Turns on the Deployments tab: @backstage-community/plugin-argocd's
    # entity tabs + the Release Versions card. See BACKSTAGE_PART5.md.
    enabled: true
  kubernetes:
    # Read-only Kubernetes plugin backend + RBAC, for the Deployments tab's
    # per-environment Logs (owner only, via the permission policy). See
    # BACKSTAGE_PART8.md.
    enabled: true
  # Public URL. Must match what the browser actually uses: the guest-auth
  # popup handshake validates against app.baseUrl, so a port-forward
  # (http://localhost:7007) no longer signs in once this is set - use the
  # real URL. The GitHub OAuth App's callback must be
  # <baseUrl>/api/auth/github/handler/frame.
  baseUrl: "https://platform.gerodimos.dev"
  # ALB via the AWS Load Balancer Controller; external-dns publishes the host
  # as a Route53 alias to it. TLS terminates at the ALB with the ACM
  # certificate from bootstrap-cluster/terraform/dns, auto-discovered by
  # host (*.gerodimos.dev) - no certificate ARN needed here.
  ingress:
    enabled: true
    className: alb
    host: platform.gerodimos.dev
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      # Straight to pod IPs (VPC CNI) - no NodePort hop.
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      # Every management-cluster Ingress with this group shares one ALB
      # (argocd., grafana. later) instead of one ALB each.
      alb.ingress.kubernetes.io/group.name: platform
      alb.ingress.kubernetes.io/healthcheck-path: /
  # Discovers Database CRs from these namespaces and publishes them as
  # catalog Resource entities related to their owning Component (see
  # backstage/packages/backend/src/modules/platformEntityProvider/ and
  # BACKSTAGE_PART4.md). "management" included alongside dev/prod since this
  # cluster is currently standing in for all three environments.
  platformCatalog:
    enabled: true
    namespaces:
      - dev
      - prod
      - management
