name: backstage-management
values: |
  image:
    repository: ghcr.io/entr0pian/backstage
    tag: "69f33a90f8bf192ff64dba2f378cdaa435a43e28"
    pullPolicy: Always
  github:
    # Same AWS Secrets Manager path used by helm-charts/platform's
    # crossplane-github-credentials ExternalSecret and consumed by
    # component-operator/scaffold-operator — same PAT, synced into the
    # backstage namespace too since Secrets don't mount cross-namespace.
    secretPath: "taskapp/platform/crossplane-github-token"
    clusterSecretStoreName: aws-secrets-manager
  # baseUrl left empty: this cluster has no real DNS hostname for backstage
  # yet. Set it (and ingress.enabled: true) once one exists — until then
  # this is reachable via kubectl port-forward, and its own internal links
  # will be wrong.
  baseUrl: ""
  ingress:
    enabled: false
