name: platform-management
values: |
  clusterSecretStore:
    aws:
      # ESO authenticates via EKS Pod Identity, no static key
      auth: podIdentity
  # Workload clusters ArgoCD here delivers to (see the platform chart's
  # external-secret-registered-clusters.yaml)
  registeredClusters:
    - dev
    - prod
  limitRange:
    enabled: false
  observability:
    recordingRules:
      enabled: true
  grafanaDashboard:
    enabled: true
  crossplane:
    secretPath: "taskapp/management/crossplane-aws"
  argocdWriteToken:
    secretPath: "taskapp/platform/argocd-write-token"
  crossplaneGithub:
    secretPath: "taskapp/platform/crossplane-github-token"
  # Component namespace + ArgoCD's GitHub webhook secret (argocd/ and
  # platform/), see platform-architecture/ARGOCD_WEBHOOK_IMPLEMENTATION.md
  componentNamespace:
    create: true
  argocdGithubWebhook:
    secretPath: "taskapp/platform/argocd-github-webhook"
